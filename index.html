<div class="wrap" role="main" aria-live="polite">

  <h1>CON LA SOMBRA DE PEDRO</h1>
  <p class="sub">Pista y Letra — Manolo Solano</p>

  <div class="shortWarn" id="warn">
    Al pulsar se abrirá publicidad. Vuelve a esta pestaña para ver el video.
  </div>

  <button id="verVideoBtn" aria-describedby="warn">
    YA PUEDES VER EL VIDEO
  </button>

  <div class="contador" id="contador">5</div>

  <div class="videoBox" id="videoBox" aria-hidden="true">
    <iframe
      id="streamcashPlayer"
      class="videoFrame"
      src="about:blank"
      data-src="https://streamcash.to/embed/yeMDgC0P9x"
      title="Con la Sombra de Pedro – Pista Manolo Solano"
      frameborder="0"
      allowfullscreen
      scrolling="no"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <div class="mutedSmall">
    Si no regresas, no verás el video. Vuelve para activarlo.
  </div>

</div>

<script>
/* ============================
   CONFIGURACIÓN
   ============================ */
const SMARTLINK = "https://otieu.com/4/10211991";

/* ============================
   ESTADO
   ============================ */
let clickedAd = false;
let countdownStarted = false;
let playerInitialized = false;
let backButtonLoaded = false;

const btn = document.getElementById("verVideoBtn");
const contadorEl = document.getElementById("contador");
const videoBox = document.getElementById("videoBox");
const warn = document.getElementById("warn");
const player = document.getElementById("streamcashPlayer");

/* ============================
   BOTÓN PUBLICITARIO
   ============================ */
btn.addEventListener("click", function () {
  if (clickedAd) return;

  clickedAd = true;

  /*
   * Se abre el smartlink en una pestaña nueva.
   * Si el navegador bloquea la ventana, el usuario
   * deberá permitirla para continuar con ese flujo.
   */
  const adWindow = window.open(SMARTLINK, "_blank");

  if (adWindow) {
    try {
      adWindow.opener = null;
    } catch (e) {}
  }

  warn.textContent =
    "Abierto en nueva pestaña. Vuelve a ESTA pestaña para iniciar el contador.";

  btn.style.display = "none";
});

/* ============================
   DETECTAR REGRESO A LA PESTAÑA
   ============================ */
document.addEventListener("visibilitychange", function () {
  if (!clickedAd || countdownStarted) return;

  if (!document.hidden) {
    countdownStarted = true;
    startCountdownThenShowVideo();
  }
});

/* ============================
   CONTADOR DE 5 SEGUNDOS
   ============================ */
function startCountdownThenShowVideo() {
  let t = 5;

  contadorEl.style.display = "block";
  contadorEl.textContent = t;

  const tick = setInterval(function () {
    t--;

    if (t >= 0) {
      contadorEl.textContent = t;
    }

    if (t < 0) {
      clearInterval(tick);

      contadorEl.style.display = "none";

      showStreamCashPlayer();
      loadPushAndBackButton();
    }
  }, 1000);
}

/* ============================
   MOSTRAR REPRODUCTOR STREAMCASH
   ============================ */
function showStreamCashPlayer() {
  videoBox.style.display = "block";
  videoBox.setAttribute("aria-hidden", "false");

  if (playerInitialized) return;

  playerInitialized = true;

  /*
   * El reproductor se carga solo cuando el usuario
   * vuelve y termina el contador.
   */
  player.src = player.dataset.src;
}

/* ============================
   CARGA DINÁMICA DE PUSH
   Y BACK BUTTON
   ============================ */
function loadPushAndBackButton() {
  if (backButtonLoaded) return;

  backButtonLoaded = true;

  /* Back button */
  const backScript1 = document.createElement("script");

  backScript1.textContent =
    'var Back_Button_Zone = 10215704; var Domain_TB = "rel-s.com";';

  document.head.appendChild(backScript1);

  const backScript2 = document.createElement("script");

  backScript2.async = true;
  backScript2.src =
    "https://p2pdh.com/bfc/2626c/reverse.min.js?sf=1";

  document.head.appendChild(backScript2);

  /* Push */
  const pushScript = document.createElement("script");

  pushScript.async = true;
  pushScript.src =
    "https://3nbf4.com/act/files/tag.min.js?z=10215539";

  pushScript.setAttribute("data-cfasync", "false");

  document.head.appendChild(pushScript);

  warn.textContent = "¡Listo! Disfruta el video.";
}
</script>
